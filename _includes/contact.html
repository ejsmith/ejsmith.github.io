<section class="section contact" id="contact">
  <div class="wrap contact-inner">
    <img class="contact-avatar" src="{{ '/assets/img/profile.jpg' | relative_url }}" alt="Eric J. Smith" width="72" height="72" loading="lazy">
    <p class="kicker">Get in touch</p>
    <h2>Say hello.</h2>
    <p class="section-lede">
      Whether it's something you're building, a question about my work or an idea you can't stop thinking about, send
      me an email. I'd love to hear about it.
    </p>
    <div class="contact-actions">
      <a class="btn btn-primary" data-email="{{ site.email_encoded }}" href="{{ site.social.linkedin }}">Email me</a>
      <a class="btn btn-ghost" href="{{ site.social.linkedin }}">LinkedIn</a>
      <a class="btn btn-ghost" href="{{ site.social.github }}">GitHub</a>
      <a class="btn btn-ghost" href="{{ site.social.x }}">X</a>
    </div>
  </div>
</section>
